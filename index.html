<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界地图填色工具</title>
    <style>
      /* 初始加载占位：不依赖 JS，React 渲染后会被替换。避免数据加载期间白屏 */
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background: #0a0a0a;
      }
      #root:empty::after {
        content: "正在加载地图数据…";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #a3a3a3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 15px;
        letter-spacing: 0.5px;
      }
      /* 转圈动画 */
      @keyframes wmf-spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
